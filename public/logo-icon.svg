<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="asBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Neon Mint Glow Border -->
    <linearGradient id="asGlowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Golden Star Accent -->
    <linearGradient id="asGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Cooling Frost Wave Gradient -->
    <linearGradient id="asFrostWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="asDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#011B15" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#asBgGrad)" stroke="url(#asGlowBorder)" stroke-width="1.8"/>

  <!-- Subtle High-Tech Tech Grid & Cooling Arcs in Background -->
  <path d="M 12 36 C 20 23, 34 21, 52 23" fill="none" stroke="url(#asFrostWave)" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
  <path d="M 10 43 C 20 33, 32 30, 48 31" fill="none" stroke="url(#asFrostWave)" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>

  <!-- Main Monogram Motif: 'A' Shield Roof + 'S' Seva Wave + Precision Wrench -->
  <g filter="url(#asDropShadow)">
    <!-- 'A' Architectural Frame (Doorstep Roof & Structure) -->
    <path d="M 32 13 
             L 46 44 
             L 39.5 44 
             L 35.2 34 
             L 28.8 34 
             L 24.5 44 
             L 18 44 
             Z 
             M 32 23.5 
             L 29.8 29.5 
             L 34.2 29.5 
             Z" 
          fill="#FFFFFF" 
          fill-rule="evenodd"
          opacity="0.95"/>

    <!-- 'S' Seva Dynamic Wave Ribbon flowing through the 'A' crossbar -->
    <path d="M 39 27.5
             C 36 25, 29 25.5, 27 28.5
             C 25 31.5, 29 33.5, 34 35
             C 39 36.5, 41 39.5, 38.5 43
             C 36 46, 29 46, 25 43"
          fill="none"
          stroke="url(#asGoldGrad)"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Precision Diagnostic Key / Wrench Accent Head inside the Apex -->
    <circle cx="32" cy="18" r="2.2" fill="#0D9488"/>
  </g>

  <!-- Golden 4-Point Radiant 5-Star Certified Spark (Top-Right) -->
  <g transform="translate(48, 14) scale(0.9)" filter="url(#asDropShadow)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="url(#asGoldGrad)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>